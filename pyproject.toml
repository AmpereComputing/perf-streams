[project]
name = "perf_streams"
version = "1.0.0"
description = 'Performance "Streams" are traces or collections of events or other messages, used for CPU performance simulation and analysis.'
readme = 'README.md'
license = {file = 'LICENSE.txt'}
authors = [
  {name = 'Aaron Lindsay', email = 'aaron@os.amperecomputing.com'},
  {name = 'Nick Kelly', email = 'kellynic@os.amperecomputing.com'},
]
requires-python = ">=3.12"
dependencies = [
    "capstone",
    "protobuf>=4.25.0",
]

[dependency-groups]
build = [
    "hatch"
]
test = [
    "coverage"
]
lint = [
    "mypy",
    "ruff"
]
all = [
    {include-group = "build"},
    {include-group = "test"},
    {include-group = "lint"},
]

[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.24"
sdist.exclude = ["*.in", "*.xz", "*.es", "*.is", "*.ms", "*.bs"]

[tool.hatch.envs.hatch-test.scripts]
# Override the default 'run' script to use 'unittest'
run = "python -m unittest discover {args}"

[tool.ruff]
# Configure similar to black (except for line-length)
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "COM",
  "D1",
  "D3",
  "D4",
  "E4",
  "E7",
  "E9",
  "ERA",
  "F",
  "FBT",
  "FIX",
  "FURB",
  "G",
  "I",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH004",
  "PIE",
  "PL",
  "PYI",
  "Q",
  "RET",
  "RUF",
  "S1",
  "SIM",
  "SLF",
  "T20",
  "TC",
  "TID252",
  "UP",
]
ignore = [
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E402",
  "E402",
  "E722",
  "E741",
  "F401",
  "F403",
  "ISC001",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "S101",
  "W191",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["F401"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/test*/*" = [
    "ANN",
    "B",
    "D",
    "F405",
    "PLR2004",
    "PLR0904"
]
"src/event_stream/processor/test/configs/*.py" = [
    "F821",
    "PLW0602",
    "PLW2901",
    "T201",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true
suppress-dummy-args = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
files = [
    "src/event_stream/event_stream.py",
    "src/event_stream/extensions/transactions.py",
    "src/event_stream/processor/plugins/python/__init__.py",
    "src/event_stream/processor/plugins/python/event_histogram.py",
    "src/event_stream/processor/plugins/python/histogram.py",
    "src/event_stream/processor/plugins/python/occupancy.py",
    "src/event_stream/processor/plugins/python/transaction_tracker.py",
    "src/instruction_stream/instruction_stream.py",
    "src/protobuf_utils/protobuf_stream.py",
    "src/protobuf_utils/protobuf_utils.py",
]
follow_imports = "skip"
ignore_missing_imports = true
